name: Vercel Preview Deployment

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_CLI_VERSION: 65.12.0

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  check-and-deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Dependabot branches get no repository secrets, so they build without deploying.
      - name: Build (no deploy)
        if: github.actor == 'dependabot[bot]'
        run: npm run build

      - name: Install Vercel CLI
        if: github.actor != 'dependabot[bot]'
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      # The token goes only to the Vercel steps, not to npm install scripts.
      - name: Pull Vercel environment information
        if: github.actor != 'dependabot[bot]'
        run: vercel pull --yes --environment=preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build project artifacts
        if: github.actor != 'dependabot[bot]'
        run: vercel build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (preview)
        if: github.actor != 'dependabot[bot]'
        run: vercel deploy --prebuilt --archive=tgz
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
